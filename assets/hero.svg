    <text x="164" y="672" fill="#e6e9ec" font-size="24">and added it to NOW.md.</text>
    <text x="164" y="716" fill="#e6e9ec" font-size="24">Next: email the shop by 2 Nov.</text>
    <text x="164" y="750" fill="#8e97a1" font-size="20">Want me to draft it?</text>
