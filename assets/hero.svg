    <text x="840" y="578" fill="#8e97a1" font-size="20">what it is</text>
    <text x="840" y="608" fill="#8e97a1" font-size="20">why it matters</text>
    <text x="840" y="638" fill="#8e97a1" font-size="20">key facts</text>
    <rect x="1154" y="490" width="310" height="190" rx="12" fill="#0c0f12" stroke="#2b333c" stroke-width="2"/>
