    <rect x="250" y="430" width="440" height="100" rx="18" fill="#1f4f4c"/>
    <text x="274" y="472" fill="#e6e9ec" font-size="24">my phone screen cracked.</text>
    <text x="274" y="506" fill="#e6e9ec" font-size="24">still under warranty?</text>

    <rect x="140" y="556" width="520" height="210" rx="18" fill="#1a2026"/>
    <text x="164" y="598" fill="#e6e9ec" font-size="24">Yes, until March. I filed it in</text>
